name: Build unsigned iPhone app
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-build
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build generator
        run: brew install xcodegen
      - name: Verify local-only package
        run: python3 tests/check_carrier.py
      - name: Build unsigned archive
        run: bash scripts/build-macos.sh
      - name: Run model tests on simulator
        shell: bash
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for key,values in reversed(list(d["devices"].items())) if "iOS" in key for v in values if v["name"].startswith("iPhone")))')
          xcodebuild test -project RitmNative.xcodeproj -scheme RitmNative -destination "platform=iOS Simulator,id=$SIM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - uses: actions/upload-artifact@v7
        with:
          name: RitmNative-unsigned
          path: build/RitmNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
